# Reply to ARP only for addresses configured on the interface the request
# arrived on. With the default (0) a multi-homed host answers for ANY local
# address on ANY interface, so when wire and Wi-Fi share one LAN the Wi-Fi
# radio answers the wire's own address-conflict probe and NetworkManager
# drops the wire's IPv4 gateway ("conflict detected ... with host <own wifi MAC>",
# metis 2026-09-09). Docker bridges are unaffected: their address is on the bridge.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.default.arp_ignore = 1
